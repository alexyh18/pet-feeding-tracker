name: Android Build

# Builds a debug APK in the cloud so you can download it without installing
# anything locally. Runs on pushes/PRs that touch the android/ project, and
# can also be triggered manually from the Actions tab.

on:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install only the modern cmdline-tools. The action's legacy default of
      # installing the deprecated `tools` package no longer exists and fails,
      # so we disable extra packages with an empty string. Gradle (AGP) will
      # auto-download the required platform/build-tools during the build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-feeding-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
