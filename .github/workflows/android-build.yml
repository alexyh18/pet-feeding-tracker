name: Android Build

# Builds a debug APK in the cloud so you can download it without installing
# anything locally. Runs on pushes/PRs that touch the android/ project, and
# can also be triggered manually from the Actions tab.

on:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install only the modern cmdline-tools. The action's legacy default of
      # installing the deprecated `tools` package no longer exists and fails,
      # so we disable extra packages with an empty string. Gradle (AGP) will
      # auto-download the required platform/build-tools during the build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Confirm the APK is signed with our committed keystore, so new builds
      # install as updates over old ones (preserving user data).
      - name: Verify signing certificate matches the committed keystore
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK: $APK"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          APK_FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1 | tr 'a-f' 'A-F' | grep -oE '[0-9A-F]{64}')
          KS_FP=$(keytool -list -v -keystore app/petfeeding-release.keystore -storepass petfeeding123 \
                  | grep "SHA256:" | head -1 | tr -d ' \t:' | tr 'a-f' 'A-F' | grep -oE '[0-9A-F]{64}')
          echo "APK cert   SHA-256: $APK_FP"
          echo "keystore   SHA-256: $KS_FP"
          if [ "$APK_FP" = "$KS_FP" ]; then
            echo "✅ Signatures match — updates will preserve data."
          else
            echo "❌ Signature mismatch"; exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-feeding-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
