<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#ffd6e0" />
<title>Did They Eat Today?</title>
<style>
  :root {
    --bg1: #fff5f7;
    --bg2: #fef3e7;
    --pink: #ffb3c6;
    --pink-dark: #ff87a3;
    --peach: #ffd6a5;
    --mint: #b8f0d2;
    --mint-dark: #7fd1a8;
    --cream: #fffdf9;
    --text: #5a4a52;
    --text-soft: #9b8a92;
    --card-shadow: 0 6px 18px rgba(255, 150, 170, 0.18);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Nunito", "Helvetica Neue", sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    min-height: 100vh;
    padding: 18px 14px 40px;
  }

  header {
    text-align: center;
    margin-bottom: 18px;
  }

  header h1 {
    font-size: 1.75rem;
    margin: 0;
    color: var(--pink-dark);
    letter-spacing: -0.5px;
  }

  header p {
    margin: 4px 0 0;
    font-size: 0.85rem;
    color: var(--text-soft);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    max-width: 520px;
    margin: 0 auto;
  }

  @media (max-width: 380px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--cream);
    border-radius: 22px;
    padding: 16px 14px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    transition: background 0.4s ease, transform 0.1s ease;
    border: 2px solid transparent;
  }

  .card.fed-today {
    background: linear-gradient(160deg, #e4fff0, #d2f8e4);
    border-color: var(--mint-dark);
  }

  .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--mint-dark);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }

  .card.fed-today .badge { opacity: 1; transform: scale(1); }

  .pet-name {
    font-size: 1.1rem;
    font-weight: 800;
    background: transparent;
    border: none;
    color: var(--text);
    width: 100%;
    padding: 2px 4px;
    border-radius: 8px;
    text-align: center;
    outline: none;
    transition: background 0.2s;
  }

  .pet-name:focus { background: #fff0f4; }

  .emoji { font-size: 2.2rem; text-align: center; line-height: 1; }

  .feed-btn {
    border: none;
    background: linear-gradient(135deg, var(--pink), var(--pink-dark));
    color: #fff;
    font-size: 1.05rem;
    font-weight: 800;
    padding: 16px 10px;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(255, 135, 163, 0.4);
    transition: transform 0.08s ease, filter 0.2s;
  }

  .feed-btn:active { transform: scale(0.95); }

  .card.fed-today .feed-btn {
    background: linear-gradient(135deg, var(--mint), var(--mint-dark));
    box-shadow: 0 4px 10px rgba(127, 209, 168, 0.4);
  }

  .last-fed {
    font-size: 0.78rem;
    color: var(--text-soft);
    text-align: center;
    min-height: 2.2em;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.3;
  }

  .last-fed strong { color: var(--text); font-weight: 700; }

  .history-btn {
    border: none;
    background: #fff0f4;
    color: var(--pink-dark);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 8px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .history-btn:active { background: #ffe0e9; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(90, 74, 82, 0.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    backdrop-filter: blur(2px);
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--cream);
    width: 100%;
    max-width: 520px;
    border-radius: 24px 24px 0 0;
    padding: 20px 20px 30px;
    max-height: 75vh;
    overflow-y: auto;
    animation: slideUp 0.25s ease;
  }

  @media (min-width: 540px) {
    .modal-overlay { align-items: center; }
    .modal { border-radius: 24px; }
  }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0.5; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .modal-header h2 { margin: 0; font-size: 1.2rem; color: var(--pink-dark); }

  .close-btn {
    border: none;
    background: #fff0f4;
    color: var(--pink-dark);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    line-height: 1;
  }

  .history-list { list-style: none; margin: 0; padding: 0; }

  .history-list li {
    padding: 12px 14px;
    background: #fff8fb;
    border-radius: 12px;
    margin-bottom: 8px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .history-list li .dot { color: var(--pink-dark); font-size: 0.7rem; }

  .empty { text-align: center; color: var(--text-soft); padding: 24px 0; font-size: 0.9rem; }

  footer { text-align: center; margin-top: 24px; font-size: 0.72rem; color: var(--text-soft); }
</style>
</head>
<body>
  <header>
    <h1>🐾 Did They Eat Today?</h1>
    <p>Tap to log a feeding · tap a name to rename</p>
  </header>

  <main class="grid" id="grid"></main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">History</h2>
        <button class="close-btn" id="closeModal" aria-label="Close">×</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <footer>Data is saved on this device.</footer>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "petFeedingTracker.v1";
  var EMOJIS = ["🐶", "🐱", "🐰", "🐹"];
  var PET_COUNT = 4;

  // ---- State ----
  function defaultState() {
    var pets = [];
    for (var i = 0; i < PET_COUNT; i++) {
      pets.push({ name: "Pet " + (i + 1), history: [] });
    }
    return { pets: pets };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.pets)) return defaultState();
      // Normalize to exactly PET_COUNT pets
      var pets = [];
      for (var i = 0; i < PET_COUNT; i++) {
        var p = parsed.pets[i] || {};
        pets.push({
          name: typeof p.name === "string" && p.name.trim() ? p.name : "Pet " + (i + 1),
          history: Array.isArray(p.history) ? p.history.filter(function (t) { return typeof t === "number"; }) : []
        });
      }
      return { pets: pets };
    } catch (e) {
      return defaultState();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn("Could not save:", e);
    }
  }

  var state = loadState();

  // ---- Date helpers ----
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function formatTimestamp(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()) +
      " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function isSameDay(ts, now) {
    var a = new Date(ts), b = new Date(now);
    return a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();
  }

  function fedToday(pet) {
    if (!pet.history.length) return false;
    var now = Date.now();
    return pet.history.some(function (ts) { return isSameDay(ts, now); });
  }

  function lastFed(pet) {
    if (!pet.history.length) return null;
    return Math.max.apply(null, pet.history);
  }

  // ---- Rendering ----
  var grid = document.getElementById("grid");

  function render() {
    grid.innerHTML = "";
    state.pets.forEach(function (pet, idx) {
      var card = document.createElement("div");
      card.className = "card" + (fedToday(pet) ? " fed-today" : "");

      var badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = "✓ Fed Today";
      card.appendChild(badge);

      var emoji = document.createElement("div");
      emoji.className = "emoji";
      emoji.textContent = EMOJIS[idx];
      card.appendChild(emoji);

      var name = document.createElement("input");
      name.className = "pet-name";
      name.type = "text";
      name.value = pet.name;
      name.maxLength = 18;
      name.setAttribute("aria-label", "Pet name");
      name.addEventListener("change", function () {
        var v = name.value.trim();
        pet.name = v || ("Pet " + (idx + 1));
        name.value = pet.name;
        saveState();
      });
      card.appendChild(name);

      var feedBtn = document.createElement("button");
      feedBtn.className = "feed-btn";
      feedBtn.textContent = "🍽️ Feed";
      feedBtn.addEventListener("click", function () {
        if (window.confirm("Did you just feed " + pet.name + "?")) {
          pet.history.push(Date.now());
          saveState();
          render();
        }
      });
      card.appendChild(feedBtn);

      var last = document.createElement("div");
      last.className = "last-fed";
      var lf = lastFed(pet);
      last.innerHTML = lf
        ? "Last fed:<br><strong>" + formatTimestamp(lf) + "</strong>"
        : "Not fed yet";
      card.appendChild(last);

      var histBtn = document.createElement("button");
      histBtn.className = "history-btn";
      histBtn.textContent = "📖 View History (" + pet.history.length + ")";
      histBtn.addEventListener("click", function () { openHistory(idx); });
      card.appendChild(histBtn);

      grid.appendChild(card);
    });
  }

  // ---- Modal ----
  var overlay = document.getElementById("modalOverlay");
  var modalTitle = document.getElementById("modalTitle");
  var historyList = document.getElementById("historyList");

  function openHistory(idx) {
    var pet = state.pets[idx];
    modalTitle.textContent = pet.name + "'s History";
    historyList.innerHTML = "";
    if (!pet.history.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No feedings logged yet 🥣";
      historyList.appendChild(empty);
    } else {
      var sorted = pet.history.slice().sort(function (a, b) { return b - a; });
      sorted.forEach(function (ts) {
        var li = document.createElement("li");
        li.innerHTML = '<span class="dot">●</span> ' + formatTimestamp(ts);
        historyList.appendChild(li);
      });
    }
    overlay.classList.add("open");
  }

  function closeHistory() { overlay.classList.remove("open"); }

  document.getElementById("closeModal").addEventListener("click", closeHistory);
  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) closeHistory();
  });

  render();
})();
</script>
</body>
</html>
